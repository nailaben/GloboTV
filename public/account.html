<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My account | GloboTV</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/customer-pages.css">
</head>
<body class="account-page">
    <main class="customer-page">
        <header class="customer-top">
            <a href="/">GloboTV</a>
            <nav>
                <select class="language-select" aria-label="Choose language">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
                <a href="/favorites.html" aria-label="Favorites">♥</a>
                <button id="logout" data-en="Sign out" data-fr="Se déconnecter">Sign out</button>
            </nav>
        </header>
        <section class="account-card">
            <aside class="account-sidebar">
                <div class="account-identity">
                    <div class="account-avatar" id="avatar">G</div>
                    <div class="account-identity-copy">
                        <strong id="customer-name"></strong>
                        <span id="customer-email"></span>
                    </div>
                </div>
            </aside>
            <section class="account-main" id="profile-settings">
                <section class="account-section">
                    <form id="customer-profile-form" class="customer-profile-form">
                        <div class="customer-profile-grid">
                            <label class="customer-profile-field">
                                <span data-en="First name" data-fr="Prénom">First name</span>
                                <input id="profile-first-name" autocomplete="given-name" minlength="1" required>
                            </label>
                            <label class="customer-profile-field">
                                <span data-en="Last name" data-fr="Nom">Last name</span>
                                <input id="profile-last-name" autocomplete="family-name" minlength="1" required>
                            </label>
                            <label class="customer-profile-field customer-profile-field-wide">
                                <span data-en="Email" data-fr="E-mail">Email</span>
                                <input id="profile-email" name="email" type="email" autocomplete="email" required>
                            </label>
                            <label class="customer-profile-field customer-profile-field-wide">
                                <span data-en="Phone number" data-fr="Numéro de téléphone">Phone number</span>
                                <span class="customer-phone-input">
                                    <select id="profile-country-code" name="country_code" autocomplete="tel-country-code" aria-label="Country calling code" required></select>
                                    <input id="profile-phone" name="phone" type="tel" autocomplete="tel-national" data-en-placeholder="Phone number" data-fr-placeholder="Numéro de téléphone" required>
                                </span>
                            </label>
                        </div>
                        <p id="profile-message" class="profile-message" role="status" hidden></p>
                        <div class="customer-profile-actions">
                            <button class="profile-discard" id="discard-profile" type="button" data-en="Discard changes" data-fr="Annuler les modifications">Discard changes</button>
                            <button class="profile-save" id="save-profile" type="submit" data-en="Save changes" data-fr="Enregistrer les modifications">Save changes</button>
                        </div>
                    </form>
                </section>
            </section>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/customer-account.js"></script>
</body>
</html>
