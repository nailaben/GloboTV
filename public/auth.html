<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب المشتري | PLAYORA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <main class="auth-shell">
        <a class="auth-back" href="/">← <span data-ar="العودة إلى المتجر" data-en="Back to store" data-fr="Retour à la boutique">العودة إلى المتجر</span></a>
        <section class="auth-card">
            <div class="auth-mark"><span class="material-symbols-outlined">layers</span></div>
            <h1 id="auth-title">مرحبًا بعودتك</h1>
            <p class="auth-subtitle" id="auth-subtitle">سجّل الدخول للمتابعة إلى حسابك</p>
            <div class="oauth-actions">
                <a class="oauth-button" href="/api/customer/google"><span class="google-g">G</span><span id="google-label">Continue with Google</span></a>
                <a class="oauth-button" href="/api/customer/facebook"><span class="facebook-f">f</span><span id="facebook-label">Continue with Facebook</span></a>
            </div>
            <div class="auth-divider"><span id="auth-divider-text">تابع باستخدام بريدك الإلكتروني</span></div>
            <form id="auth-form">
                <label id="name-field" class="auth-field" hidden>
                    <span data-ar="الاسم الكامل" data-en="Full name" data-fr="Nom complet">الاسم الكامل</span>
                    <span class="auth-input"><span class="material-symbols-outlined">person</span><input id="name" autocomplete="name" placeholder="الاسم الكامل" minlength="2"></span>
                </label>
                <label class="auth-field">
                    <span data-ar="البريد الإلكتروني" data-en="Email address" data-fr="Adresse e-mail">البريد الإلكتروني</span>
                    <span class="auth-input"><span class="material-symbols-outlined">mail</span><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></span>
                </label>
                <label class="auth-field">
                    <span data-ar="كلمة المرور" data-en="Password" data-fr="Mot de passe">كلمة المرور</span>
                    <span class="auth-input"><span class="material-symbols-outlined">lock</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" minlength="8" required><button type="button" id="toggle-password" class="password-toggle" aria-label="إظهار كلمة المرور"><span class="material-symbols-outlined">visibility</span></button></span>
                </label>
                <div id="auth-error" class="auth-error" role="alert" hidden></div>
                <button id="submit-auth" class="auth-submit" type="submit">تسجيل الدخول</button>
            </form>
            <p class="auth-switch" id="auth-switch">ليس لديك حساب؟ <button type="button" id="switch-mode">أنشئ حسابًا مجانًا</button></p>
        </section>
    </main>
    <script src="/js/api.js"></script><script src="/js/customer-auth.js"></script>
</body>
</html>
